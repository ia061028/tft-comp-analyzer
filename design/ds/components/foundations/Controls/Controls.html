<!doctype html>
<meta charset="utf-8" />
<title>Controls</title>
<link rel="stylesheet" href="/styles.css" />
<body style="background:var(--color-g-0);padding:24px">
<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
  <div class="seg"><button class="seg__btn seg__btn--on">全体</button><button class="seg__btn">7</button><button class="seg__btn">8</button></div>
  <button class="icon-btn">⚙</button>
  <button class="icon-btn icon-btn--on">⚙</button>
  <input class="input" value="5" />
  <button class="comp__copy" style="width:32px">⎘</button>
</div>
<div style="margin-top:16px;display:flex;gap:8px">
  <span class="tip"><button class="tile tile--on" style="width:44px"><img class="tile__img" src="https://raw.communitydragon.org/latest/game/assets/maps/particles/tft/item_icons/traits/spatula/set17/tft17_emblem_animatech.tft_set17.png" alt="" /><span class="tile__count">2</span></button></span>
  <span class="tip"><button class="tile" style="width:44px"><img class="tile__img" src="https://raw.communitydragon.org/latest/game/assets/maps/particles/tft/item_icons/traits/spatula/set17/tft17_emblem_arbiter.tft_set17.png" alt="" /></button></span>
  <span class="tip"><button class="tile tile--over" style="width:44px"><img class="tile__img" src="https://raw.communitydragon.org/latest/game/assets/maps/particles/tft/item_icons/traits/spatula/set17/tft17_emblem_bastion.tft_set17.png" alt="" /><span class="tile__count">3</span></button></span>
</div>
<p class="empty" style="margin-top:16px">紋章を選択すると、その紋章だけで組める構成が表示されます</p>
</body>

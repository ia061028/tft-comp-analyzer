<!doctype html>
<meta charset="utf-8" />
<title>Type</title>
<link rel="stylesheet" href="/styles.css" />
<body style="background:var(--color-g-0);padding:24px">
<div style="display:flex;align-items:baseline;gap:16px;margin-bottom:10px">
  <code style="width:110px;font-size:var(--text-sm);color:var(--color-ink-3)">--text-hero</code>
  <code style="width:44px;font-size:var(--text-sm);color:var(--color-ink-3)">28px</code>
  <span style="font-size:var(--text-hero);color:var(--color-ink);font-weight:700;font-variant-numeric:tabular-nums">2.68</span>
  <span style="font-size:var(--text-xs);color:var(--color-ink-3)">平均順位の数字だけ。これが「祭事」</span>
</div>
<div style="display:flex;align-items:baseline;gap:16px;margin-bottom:10px">
  <code style="width:110px;font-size:var(--text-sm);color:var(--color-ink-3)">--text-lg</code>
  <code style="width:44px;font-size:var(--text-sm);color:var(--color-ink-3)">17px</code>
  <span style="font-size:var(--text-lg);color:var(--color-ink);font-weight:700;font-variant-numeric:tabular-nums">見出し</span>
  <span style="font-size:var(--text-xs);color:var(--color-ink-3)"></span>
</div>
<div style="display:flex;align-items:baseline;gap:16px;margin-bottom:10px">
  <code style="width:110px;font-size:var(--text-sm);color:var(--color-ink-3)">--text-md</code>
  <code style="width:44px;font-size:var(--text-sm);color:var(--color-ink-3)">14px</code>
  <span style="font-size:var(--text-md);color:var(--color-ink);font-weight:700;font-variant-numeric:tabular-nums">本文・操作要素</span>
  <span style="font-size:var(--text-xs);color:var(--color-ink-3)"></span>
</div>
<div style="display:flex;align-items:baseline;gap:16px;margin-bottom:10px">
  <code style="width:110px;font-size:var(--text-sm);color:var(--color-ink-3)">--text-sm</code>
  <code style="width:44px;font-size:var(--text-sm);color:var(--color-ink-3)">12px</code>
  <span style="font-size:var(--text-sm);color:var(--color-ink);font-weight:700;font-variant-numeric:tabular-nums">副指標・件数</span>
  <span style="font-size:var(--text-xs);color:var(--color-ink-3)"></span>
</div>
<div style="display:flex;align-items:baseline;gap:16px;margin-bottom:10px">
  <code style="width:110px;font-size:var(--text-sm);color:var(--color-ink-3)">--text-xs</code>
  <code style="width:44px;font-size:var(--text-sm);color:var(--color-ink-3)">11px</code>
  <span style="font-size:var(--text-xs);color:var(--color-ink);font-weight:700;font-variant-numeric:tabular-nums">ラベル・特性チップ</span>
  <span style="font-size:var(--text-xs);color:var(--color-ink-3)"></span>
</div>
</body>
